# Fresh macOS arm64 validation recipe; the resolved package inventory is recorded separately.
# Install hrbrthemes and the Python requirements using docs/ENVIRONMENT_VALIDATION.md.
channels:
  - conda-forge
dependencies:
  - r-base=4.5.1
  - python=3.12.13
  - pip
  - pandoc=3.12
  - cairo=1.18.4
  - pango=1.56.4
  - r-ggplot2=4.0.3
  - r-dplyr=1.2.0
  - r-readr=2.2.0
  - r-tidyr=1.3.2
  - r-cowplot=1.2.0
  - r-patchwork=1.3.2
  - r-jsonlite=2.0.0
  - r-systemfonts=1.3.2
  - r-survival=3.8_6
  - r-broom=1.0.12
  - r-nnet=7.3_20
  - r-rmarkdown=2.31
  - r-knitr=1.51
  - r-ggbeeswarm=0.7.3
  - r-ggtext=0.1.2
  - r-purrr=1.2.1
  - r-scales=1.4.0
